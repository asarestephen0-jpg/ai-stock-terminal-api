<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Terminal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 9999px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
        }

        .status-dot.syncing {
            background-color: var(--accent-yellow);
            animation: pulse 1.5s infinite;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .symbol {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .signal-pill {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .signal-buy {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .signal-sell {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .signal-hold {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-yellow);
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 0.9rem;
        }

        .metric-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .metric-value {
            font-weight: 600;
        }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>AI Stock Terminal</h1>
            <div id="connectionState" class="status-badge">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">Connected to Render</span>
            </div>
        </div>
        <div class="controls">
            <button onclick="fetchSignals()">Refresh Signals</button>
        </div>
    </header>

    <main>
        <div id="signalsGrid" class="grid">
            <div class="loading-state">
                <p>Connecting to live backend at <code>https://ai-stock-terminal-api.onrender.com</code>...</p>
                <p style="font-size: 0.85rem; margin-top: 8px; color: #6b7280;">(Free tier servers may take up to 45 seconds to wake up on cold boot)</p>
            </div>
        </div>
    </main>

    <script>
        // Live Render Backend URL
        const API_URL = 'https://ai-stock-terminal-api.onrender.com/api/signals';

        async function fetchSignals() {
            const grid = document.getElementById('signalsGrid');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            statusDot.classList.add('syncing');
            statusText.textContent = 'Updating...';

            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                renderSignals(data);

                statusDot.classList.remove('syncing');
                statusText.textContent = 'Connected to Render';
            } catch (error) {
                console.error('API Fetch Error:', error);
                statusDot.classList.remove('syncing');
                statusDot.style.backgroundColor = 'var(--accent-red)';
                statusText.textContent = 'Connection Failed';

                grid.innerHTML = `
                    <div class="loading-state">
                        <p style="color: var(--accent-red);">Unable to fetch market signals from live API.</p>
                        <p style="font-size: 0.85rem; margin-top: 8px;">Ensure CORS is enabled on main.py or check browser developer tools (F12).</p>
                    </div>
                `;
            }
        }

        function renderSignals(data) {
            const grid = document.getElementById('signalsGrid');
            grid.innerHTML = '';

            // Handle array response or object wrapper
            const signals = Array.isArray(data) ? data : (data.signals || []);

            if (signals.length === 0) {
                grid.innerHTML = `<div class="loading-state"><p>No market signals currently active.</p></div>`;
                return;
            }

            signals.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const signalType = (item.signal || item.recommendation || 'HOLD').toLowerCase();
                let pillClass = 'signal-hold';
                if (signalType.includes('buy')) pillClass = 'signal-buy';
                if (signalType.includes('sell')) pillClass = 'signal-sell';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="symbol">${item.symbol || 'N/A'}</span>
                        <span class="signal-pill ${pillClass}">${item.signal || 'HOLD'}</span>
                    </div>
                    <div class="metrics">
                        <div class="metric-item">
                            <span class="metric-label">Price</span>
                            <span class="metric-value">$${item.price ? parseFloat(item.price).toFixed(2) : '---'}</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">RSI</span>
                            <span class="metric-value">${item.rsi ? parseFloat(item.rsi).toFixed(1) : '---'}</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">Sentiment</span>
                            <span class="metric-value">${item.sentiment || 'Neutral'}</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">Confidence</span>
                            <span class="metric-value">${item.confidence ? (item.confidence * 100).toFixed(0) + '%' : '---'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Fetch on load
        document.addEventListener('DOMContentLoaded', fetchSignals);
    </script>
</body>
</html>
