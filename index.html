<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        header { grid-column: 1 / -1; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; }

        .market-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tab { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 500; }
        .tab:hover { color: var(--text-primary); border-color: var(--accent-blue); }
        .tab.active { background-color: var(--accent-blue); color: #ffffff; border-color: var(--accent-blue); }

        .chart-container { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 25px; height: 320px; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chart-wrapper { position: relative; height: 230px; width: 100%; }

        .section-title { font-size: 1.2rem; margin-bottom: 15px; }
        .signals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .symbol { font-weight: 700; font-size: 1.1rem; }
        .signal-pill { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
        .signal-buy { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .signal-sell { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .signal-hold { background-color: rgba(148, 163, 184, 0.2); color: var(--text-secondary); border: 1px solid var(--text-secondary); }

        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; }
        .metric-label { color: var(--text-secondary); font-size: 0.75rem; }
        .metric-value { font-weight: 600; margin-top: 2px; }

        /* AI Chat Panel */
        .ai-chat-panel { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; height: 600px; }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 0.9rem; }
        .msg { padding: 10px 12px; border-radius: 6px; line-height: 1.4; }
        .user-msg { background-color: var(--accent-blue); align-self: flex-end; max-width: 85%; }
        .ai-msg { background-color: #0f172a; border: 1px solid var(--border-color); align-self: flex-start; max-width: 95%; white-space: pre-line; }
        
        .chat-input-area { padding: 12px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; background-color: #0f172a; border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 12px; border-radius: 6px; outline: none; }
        .chat-input-area button { background-color: var(--accent-green); color: #000; font-weight: 700; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AI Stock Terminal</h1>
            <div class="market-tabs">
                <button class="tab active">Markets</button>
                <button class="tab">US</button>
                <button class="tab">Futures</button>
                <button class="tab">Global</button>
                <button class="tab">Commodities</button>
                <button class="tab">Currencies</button>
                <button class="tab">Cryptos</button>
            </div>
        </header>

        <!-- Left Column: Chart and Signals -->
        <main>
            <div class="chart-container">
                <div class="chart-header">
                    <h2>Market Trend Analysis</h2>
                    <span id="chartLabel" style="color: var(--accent-green); font-weight:600;">DOW Intraday</span>
                </div>
                <div class="chart-wrapper">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <h2 class="section-title">Live AI Market Signals</h2>
            <div class="signals-grid" id="signalsGrid">
                <!-- Cards render dynamically -->
            </div>
        </main>

        <!-- Right Column: AI Advisory Chat Panel -->
        <aside class="ai-chat-panel">
            <div class="chat-header">
                🤖 AI Stock Advisory
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="msg ai-msg">Welcome! Ask me for advice on any ticker (e.g., <i>"Should I buy NVDA right now?"</i> or <i>"Analyze TSLA technicals"</i>).</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ask AI Advisor..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </aside>
    </div>

    <script>
        const API_URL = 'https://ai-stock-terminal-api.onrender.com';

        const categoryData = {
            'Markets': { label: 'DOW Intraday', labels: ['10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM'], data: [51760, 51850, 51680, 52080, 51950, 51880, 51947] },
            'US': { label: 'S&P 500 Intraday', labels: ['10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM'], data: [7390, 7402, 7398, 7415, 7410, 7408, 7411] },
            'Futures': { label: 'NASDAQ Futures', labels: ['10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM'], data: [25100, 25050, 24900, 24950, 24920, 24960, 24975] },
            'Global': { label: 'FTSE 100', labels: ['10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM'], data: [8200, 8220, 8215, 8240, 8230, 8250, 8260] },
            'Commodities': { label: 'WTI Oil ($)', labels: ['10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM'], data: [89.3, 88.5, 87.1, 86.4, 85.8, 85.2, 85.0] },
            'Currencies': { label: 'EUR/USD', labels: ['10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM'], data: [1.082, 1.084, 1.083, 1.085, 1.087, 1.086, 1.088] },
            'Cryptos': { label: 'Bitcoin ($)', labels: ['10 AM', '11 AM', '12 PM', '1 PM', '2 PM', '3 PM', '4 PM'], data: [64200, 64800, 64500, 65300, 66100, 65800, 66400] }
        };

        const ctx = document.getElementById('trendChart').getContext('2d');
        const trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: categoryData['Markets'].labels,
                datasets: [{
                    label: categoryData['Markets'].label,
                    data: categoryData['Markets'].data,
                    borderColor: '#22c55e',
                    borderWidth: 2,
                    fill: false,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#9ca3af' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#9ca3af' } }
                }
            }
        });

        function updateChartCategory(categoryName) {
            const cat = categoryData[categoryName] || categoryData['Markets'];
            trendChart.data.labels = cat.labels;
            trendChart.data.datasets[0].label = cat.label;
            trendChart.data.datasets[0].data = cat.data;
            trendChart.update();
            document.getElementById('chartLabel').innerText = cat.label;
        }

        async function fetchSignals(category = 'Markets') {
            const grid = document.getElementById('signalsGrid');
            try {
                const response = await fetch(`${API_URL}/api/signals?category=${category.toLowerCase()}`);
                const data = await response.json();
                grid.innerHTML = '';
                const signals = data.signals || [];

                signals.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const signal = (item.signal || 'HOLD').toUpperCase();
                    let pillClass = 'signal-hold';
                    if (signal.includes('BUY')) pillClass = 'signal-buy';
                    if (signal.includes('SELL')) pillClass = 'signal-sell';

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="symbol">${item.symbol}</span>
                            <span class="signal-pill ${pillClass}">${signal}</span>
                        </div>
                        <div class="metrics">
                            <div><div class="metric-label">PRICE</div><div class="metric-value">$${item.price}</div></div>
                            <div><div class="metric-label">RSI</div><div class="metric-value">${item.rsi}</div></div>
                            <div><div class="metric-label">SENTIMENT</div><div class="metric-value">${item.sentiment}</div></div>
                            <div><div class="metric-label">CONFIDENCE</div><div class="metric-value">${(item.confidence * 100).toFixed(0)}%</div></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Failed to fetch API signals:", err);
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const messages = document.getElementById('chatMessages');
            const prompt = input.value.trim();

            if (!prompt) return;

            // Render User Prompt
            messages.innerHTML += `<div class="msg user-msg">${prompt}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Loading state
            const loadingId = "loading-" + Date.now();
            messages.innerHTML += `<div class="msg ai-msg" id="${loadingId}">Analyzing market data...</div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await res.json();
                document.getElementById(loadingId).innerText = data.response;
            } catch (err) {
                document.getElementById(loadingId).innerText = "Failed to connect to AI Advisor backend.";
            }
            messages.scrollTop = messages.scrollHeight;
        }

        document.querySelectorAll('.market-tabs .tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.market-tabs .tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                updateChartCategory(e.target.innerText);
                fetchSignals(e.target.innerText);
            });
        });

        document.addEventListener('DOMContentLoaded', () => fetchSignals('Markets'));
    </script>
</body>
</html>
