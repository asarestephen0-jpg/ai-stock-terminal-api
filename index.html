<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Terminal</title>
    <!-- Chart.js CDN for Stock Trend Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d131d;
            --card-bg: #151d2a;
            --card-active-bg: #1c2738;
            --border-color: #232f42;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 9999px;
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
        }

        /* Nav Tabs */
        .market-tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .tab {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .tab.active, .tab:hover {
            color: var(--text-primary);
        }

        /* Summary Index Strip */
        .index-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .index-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .index-card.active {
            background-color: var(--card-active-bg);
            border-color: var(--accent-blue);
        }

        .index-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .index-value {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .index-change {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }

        /* Chart Section */
        .chart-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .time-filters {
            display: flex;
            gap: 8px;
        }

        .time-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .time-btn.active {
            background-color: var(--card-active-bg);
            color: var(--text-primary);
        }

        .canvas-wrapper {
            position: relative;
            height: 320px;
            width: 100%;
        }

        /* Signals Cards Grid */
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .symbol {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .signal-pill {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .signal-buy { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
        .signal-sell { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
        .signal-hold { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.85rem;
        }

        .metric-label { color: var(--text-secondary); font-size: 0.75rem; }
        .metric-value { font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>AI Stock Terminal</h1>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span>Live Feed Connected</span>
        </div>
    </header>

    <!-- Market Categories -->
    <div class="market-tabs">
        <span class="tab active">Markets</span>
        <span class="tab">US</span>
        <span class="tab">Futures</span>
        <span class="tab">Global</span>
        <span class="tab">Commodities</span>
        <span class="tab">Currencies</span>
        <span class="tab">Cryptos</span>
    </div>

    <!-- Index Cards Strip -->
    <div class="index-grid">
        <div class="index-card active">
            <div class="index-title">DOW ↗</div>
            <div class="index-value">51,947.25</div>
            <div class="index-change positive">+235.60 (+0.46%)</div>
        </div>
        <div class="index-card">
            <div class="index-title">S&P 500 ↗</div>
            <div class="index-value">7,411.98</div>
            <div class="index-change positive">+3.68 (+0.05%)</div>
        </div>
        <div class="index-card">
            <div class="index-title">NASDAQ ↗</div>
            <div class="index-value">24,975.82</div>
            <div class="index-change negative">-161.87 (-0.64%)</div>
        </div>
        <div class="index-card">
            <div class="index-title">Russell 2000 ↗</div>
            <div class="index-value">2,930.00</div>
            <div class="index-change negative">-10.16 (-0.35%)</div>
        </div>
    </div>

    <!-- Trend Graph Canvas -->
    <div class="chart-container">
        <div class="chart-header">
            <span style="font-weight: 600; color: var(--text-secondary)">DOW Intraday Movement</span>
            <div class="time-filters">
                <button class="time-btn active">1D</button>
                <button class="time-btn">5D</button>
                <button class="time-btn">1M</button>
                <button class="time-btn">1Y</button>
                <button class="time-btn">Max</button>
            </div>
        </div>
        <div class="canvas-wrapper">
            <canvas id="trendChart"></canvas>
        </div>
    </div>

    <!-- API AI Signals List -->
    <div class="section-title">Live Algorithmic Signals</div>
    <div id="signalsGrid" class="grid">
        <!-- Dynamically injected via API -->
    </div>

    <script>
        const API_URL = 'https://ai-stock-terminal-api.onrender.com/api/signals';

        // 1. Initialize Trend Chart
        const ctx = document.getElementById('trendChart').getContext('2d');
        
        // Green Gradient Fill
        const gradient = ctx.createLinearGradient(0, 0, 0, 300);
        gradient.addColorStop(0, 'rgba(34, 197, 94, 0.35)');
        gradient.addColorStop(1, 'rgba(34, 197, 94, 0.0)');

        const trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['10:00 AM', '11:00 AM', '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM'],
                datasets: [{
                    label: 'DOW',
                    data: [51760, 51850, 51680, 52080, 51950, 51880, 51947],
                    borderColor: '#22c55e',
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: gradient,
                    tension: 0.3,
                    pointRadius: 0,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#9ca3af' } },
                    y: { grid: { color: '#232f42' }, ticks: { color: '#9ca3af' } }
                }
            }
        });

        // 2. Fetch Live Signals from Render FastAPI
        async function fetchSignals() {
            const grid = document.getElementById('signalsGrid');
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                grid.innerHTML = '';
                const signals = Array.isArray(data) ? data : (data.signals || []);

                signals.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const signal = (item.signal || 'HOLD').toUpperCase();
                    let pillClass = 'signal-hold';
                    if (signal.includes('BUY')) pillClass = 'signal-buy';
                    if (signal.includes('SELL')) pillClass = 'signal-sell';

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="symbol">${item.symbol || 'N/A'}</span>
                            <span class="signal-pill ${pillClass}">${signal}</span>
                        </div>
                        <div class="metrics">
                            <div><div class="metric-label">PRICE</div><div class="metric-value">$${item.price}</div></div>
                            <div><div class="metric-label">RSI</div><div class="metric-value">${item.rsi}</div></div>
                            <div><div class="metric-label">SENTIMENT</div><div class="metric-value">${item.sentiment}</div></div>
                            <div><div class="metric-label">CONFIDENCE</div><div class="metric-value">${(item.confidence * 100).toFixed(0)}%</div></div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Failed to fetch API signals:", err);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchSignals);
    </script>
</body>
</html>
